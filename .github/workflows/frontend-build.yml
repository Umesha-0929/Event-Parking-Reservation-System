name: Frontend Build and Tests

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/sevpms-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/sevpms-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build -- --configuration production

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Unit tests
        run: npm run test:ci

      - name: Route smoke E2E
        run: npm run e2e
